repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-json
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-xml
      - id: detect-private-key

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        types: [text]
        args: [--no-verify]

  - repo: local
    hooks:
      - id: check-jsonl
        name: Check JSON Lines
        entry: >-
          sh -c 'for file do
            python3 -m json.tool --json-lines < "$file" >/dev/null || {
              printf "Invalid JSON Lines in %s\n" "$file" >&2;
              exit 1;
            };
          done' --
        language: system
        files: '\.jsonl$'
      - id: prettier
        name: Prettier
        entry: node_modules/.bin/prettier --write
        language: system
        files: '^web/(?!dist/).*\.(html|css|[cm]?ts|tsx)$'
      - id: typecheck
        name: TypeScript typecheck
        entry: npm run typecheck
        language: system
        files: '^(web/src/.*\.([cm]?ts|tsx|json)|config/.*\.json|(package(-lock)?|tsconfig)\.json)$'
        pass_filenames: false
      - id: gofmt
        name: Go formatting
        entry: gofmt -w --
        language: system
        types: [go]
      - id: go-vet
        name: Go vet
        entry: go vet ./...
        language: system
        files: '(\.go$|(^|/)go\.(mod|sum|work|work\.sum)$)'
        pass_filenames: false
